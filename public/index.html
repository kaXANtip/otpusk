  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  <script>
    /* тема до загрузки CSS-приложения — без белой вспышки в тёмном Telegram */
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var dark = tg && tg.initData ? tg.colorScheme === 'dark'
        : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>

        </span>
        <span class="tab__label">Корзина</span>
      </button>
      <button class="tab" data-tab="profile" aria-label="Профиль">
        <svg class="i"><use href="#i-user"/></svg><span>Профиль</span>

    </nav>
